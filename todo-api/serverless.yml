org: ${file(./config.yml):org}
service: todo-api

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: eu-north-1
  iam:
    role: ${file(./config.yml):role}

functions:
  ## AUTH
  login:
    handler: functions/auth/login/index.handler
    events:
      - httpApi:
          path: /api/auth/login
          method: POST
  register:
    handler: functions/auth/register/index.handler
    events:
      - httpApi:
          path: /api/auth/register
          method: POST
  ## TODOS
  getTodos:
    handler: functions/todos/getTodos/index.handler
    events:
      - httpApi:
          path: /api/todos
          method: GET
  addNewTodo:
    handler: functions/todos/addNewTodo/index.handler
    events:
      - httpApi:
          path: /api/todos
          method: POST
  deleteTodo:
    handler: functions/todos/deleteTodo/index.handler
    events:
      - httpApi:
          path: /api/todos/{id}
          method: DELETE


resources:
  Resources:
    TodoDB:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TodoDB
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S

        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

